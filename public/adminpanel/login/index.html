<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qurania - Cloud Admin Engine</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs (Compat version) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #0b1a11 0%, #050806 60%, #020302 100%);
      --card-bg: rgba(14, 26, 19, 0.65);
      --card-bg-hover: rgba(18, 35, 25, 0.85);
      --card-border: rgba(201, 168, 76, 0.15);
      --card-border-hover: rgba(201, 168, 76, 0.45);
      --primary-gold: #D4AF37;
      --light-gold: #F3E5AB;
      --secondary-emerald: #1B5E35;
      --accent-orange: #FF8A00;
      --text-white: #FFFFFF;
      --text-gray: rgba(255, 255, 255, 0.7);
      --text-dark-gray: rgba(255, 255, 255, 0.45);
      --glow-gold: rgba(212, 175, 55, 0.25);
      --glow-emerald: rgba(27, 94, 53, 0.55);
      --error-color: #ff4d4d;
      --success-color: #2ecc71;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-white);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Background blobs */
    .glow-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(140px);
      opacity: 0.35;
    }

    .blob-1 {
      width: 450px;
      height: 450px;
      background: var(--glow-emerald);
      top: -100px;
      left: -100px;
    }

    .blob-2 {
      width: 500px;
      height: 500px;
      background: var(--glow-gold);
      bottom: -150px;
      right: -150px;
    }

    .container {
      width: 100%;
      max-width: 1300px;
      padding: 30px 16px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Login View */
    .admin-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 45px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 30px var(--glow-emerald);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .logo-outer {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 24px;
    }

    .logo-container {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(15, 38, 25, 0.85) 0%, rgba(6, 10, 8, 0.95) 100%);
      border: 2px solid var(--primary-gold);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transform: rotate(45deg);
    }

    .logo-img {
      width: 65px;
      height: 65px;
      transform: rotate(-45deg);
      object-fit: contain;
    }

    .admin-card h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #FFFFFF 30%, var(--primary-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .admin-card .tagline {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--primary-gold);
      text-align: center;
      margin-bottom: 35px;
      font-weight: 600;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-gold);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 12px;
      padding: 12px 16px;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--primary-gold);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary-gold);
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-gray);
      cursor: pointer;
    }

    /* Buttons */
    .action-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, var(--primary-gold) 0%, #B89028 100%);
      color: #000000;
      box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
    }

    .action-btn:hover {
      background: linear-gradient(135deg, #FFE875 0%, var(--primary-gold) 100%);
      box-shadow: 0 8px 22px rgba(212, 175, 55, 0.4);
      transform: translateY(-2px);
    }

    .action-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Alert Displays */
    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      border-left: 4px solid;
    }

    .alert.error {
      background: rgba(255, 77, 77, 0.1);
      border-color: var(--error-color);
      color: #ff6666;
    }

    .alert.success {
      background: rgba(46, 204, 113, 0.1);
      border-color: var(--success-color);
      color: #58d68d;
    }

    /* Loading Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(0,0,0,0.1);
      border-top-color: #000000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Dashboard Layout */
    #dashboard-view {
      display: none;
      width: 100%;
      animation: fadeIn 0.6s ease-out;
    }

    .dashboard-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .db-title-wrap {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .db-logo {
      width: 42px;
      height: 42px;
      border: 1.5px solid var(--primary-gold);
      border-radius: 10px;
      transform: rotate(45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.2);
    }

    .db-logo img {
      width: 28px;
      height: 28px;
      transform: rotate(-45deg);
    }

    .db-title-wrap h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      letter-spacing: 2px;
      color: #FFFFFF;
    }

    .db-title-wrap h1 span {
      color: var(--primary-gold);
    }

    .admin-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .admin-email {
      font-size: 0.85rem;
      color: var(--text-gray);
      background: rgba(255,255,255,0.06);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .logout-btn {
      background: rgba(255, 77, 77, 0.15);
      color: #ff6666;
      border: 1px solid rgba(255, 77, 77, 0.3);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: var(--error-color);
      color: #000000;
      box-shadow: 0 4px 15px rgba(255, 77, 77, 0.35);
    }

    /* Main Grid Layout */
    .db-main-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 30px;
      width: 100%;
    }

    /* Sidebar Navigation */
    .sidebar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      align-self: start;
    }

    .nav-btn {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-gray);
      padding: 12px 16px;
      text-align: left;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .nav-btn:hover {
      background: rgba(255,255,255,0.04);
      color: #FFFFFF;
    }

    .nav-btn.active {
      background: rgba(212, 175, 55, 0.08);
      color: var(--primary-gold);
      border: 1px solid rgba(212, 175, 55, 0.25);
    }

    .nav-badge {
      position: absolute;
      right: 14px;
      background: var(--primary-gold);
      color: #000;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .nav-badge.orange {
      background: var(--accent-orange);
      color: #fff;
    }

    /* Content Area Layout */
    .content-area {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 30px;
      min-height: 600px;
    }

    .content-area.single-col {
      grid-template-columns: 1fr;
    }

    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      align-self: start;
    }

    .panel-card h3 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-gold);
      margin-bottom: 22px;
      border-left: 3.5px solid var(--primary-gold);
      padding-left: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Dynamic Lists inside Panels */
    .items-container {
      max-height: 520px;
      overflow-y: auto;
    }

    .item-row {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 12px;
      gap: 15px;
      transition: all 0.3s ease;
    }

    .item-row:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(212, 175, 55, 0.25);
    }

    .item-img {
      width: 50px;
      height: 35px;
      border-radius: 6px;
      object-fit: cover;
      background: rgba(0, 0, 0, 0.2);
    }

    .item-info {
      flex-grow: 1;
      overflow: hidden;
    }

    .item-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-subtitle {
      font-size: 0.76rem;
      color: var(--text-dark-gray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--error-color);
      opacity: 0.75;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-btn:hover {
      background: rgba(255, 77, 77, 0.12);
      opacity: 1;
    }

    .delete-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Support Tickets Styling */
    .ticket-row {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .ticket-row:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(212, 175, 55, 0.25);
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ticket-user {
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
    }

    .badge-row {
      display: flex;
      gap: 8px;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .status-badge.open { background: rgba(52, 152, 219, 0.15); color: #3498db; }
    .status-badge.inprogress { background: rgba(230, 126, 34, 0.15); color: #e67e22; }
    .status-badge.resolved { background: rgba(46, 204, 113, 0.15); color: #2ecc71; }
    .status-badge.closed { background: rgba(149, 165, 166, 0.15); color: #95a5a6; }

    .priority-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .priority-badge.low { background: rgba(255,255,255,0.08); color: #aaa; }
    .priority-badge.medium { background: rgba(52, 152, 219, 0.15); color: #3498db; }
    .priority-badge.high { background: rgba(241, 196, 15, 0.15); color: #f1c40f; }
    .priority-badge.urgent { background: rgba(231, 76, 60, 0.15); color: #e74c3c; }

    .ticket-body {
      font-size: 0.9rem;
      color: var(--text-gray);
      line-height: 1.5;
    }

    .ticket-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
      margin-top: 4px;
    }

    .ticket-controls {
      display: flex;
      gap: 12px;
    }

    .ticket-select {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 0.78rem;
      padding: 4px 8px;
      outline: none;
      cursor: pointer;
    }

    .chat-trigger-btn {
      background: rgba(212, 175, 55, 0.1);
      color: var(--primary-gold);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-trigger-btn:hover {
      background: var(--primary-gold);
      color: #000;
      box-shadow: 0 4px 10px rgba(212, 175, 55, 0.25);
    }

    /* Chat Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .chat-modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      width: 100%;
      max-width: 600px;
      height: 80vh;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeInUp 0.4s ease-out;
    }

    .chat-modal-header {
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header-title h4 {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    .chat-header-title p {
      font-size: 0.78rem;
      color: var(--text-dark-gray);
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      color: var(--text-gray);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-modal-btn:hover {
      color: var(--error-color);
    }

    .chat-messages-container {
      flex-grow: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.45;
      position: relative;
    }

    .chat-bubble.user {
      align-self: flex-start;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    .chat-bubble.admin {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--secondary-emerald) 0%, #113c21 100%);
      border: 1px solid rgba(46, 204, 113, 0.2);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .chat-bubble-time {
      display: block;
      font-size: 0.7rem;
      color: var(--text-dark-gray);
      margin-top: 6px;
      text-align: right;
    }

    .chat-modal-footer {
      padding: 16px 24px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .chat-input-wrapper {
      display: flex;
      gap: 12px;
    }

    .chat-input-wrapper input {
      flex-grow: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .chat-input-wrapper input:focus {
      border-color: var(--primary-gold);
    }

    .chat-send-btn {
      background: var(--primary-gold);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .chat-send-btn:hover {
      background: var(--light-gold);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    /* Users Table Layout */
    .users-table-container {
      overflow-x: auto;
      width: 100%;
    }

    .users-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .users-table th {
      padding: 14px 16px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.08);
      font-size: 0.85rem;
      color: var(--primary-gold);
      text-transform: uppercase;
      font-weight: 700;
    }

    .users-table td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.9rem;
      color: #fff;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255,255,255,0.1);
      transition: .3s;
      border-radius: 34px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--secondary-emerald);
      border-color: rgba(46, 204, 113, 0.3);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: var(--primary-gold);
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-dark-gray);
      font-size: 0.95rem;
    }

    /* System Stats overview */
    .stats-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
      width: 100%;
    }

    .stat-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-icon {
      width: 46px;
      height: 46px;
      background: rgba(212, 175, 55, 0.08);
      border: 1.5px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-gold);
    }

    .stat-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .stat-info h4 {
      font-size: 0.75rem;
      color: var(--text-dark-gray);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .stat-info p {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.2);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(212, 175, 55, 0.45);
    }

    @media (max-width: 992px) {
      .db-main-layout {
        grid-template-columns: 1fr;
      }
      .content-area {
        grid-template-columns: 1fr;
      }
      .sidebar {
        flex-direction: row;
        overflow-x: auto;
        padding: 12px;
        align-self: stretch;
      }
      .nav-btn {
        flex-shrink: 0;
        width: auto;
      }
      .nav-badge {
        position: relative;
        right: 0;
        margin-left: 6px;
      }
    }

    /* Switch styling */
    .switch-container {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 24px;
    }
    .switch-container input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255,255,255,0.1);
      transition: .3s;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .switch-slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #aaa;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .switch-slider {
      background-color: var(--primary-gold);
      border-color: var(--primary-gold);
    }
    input:checked + .switch-slider:before {
      transform: translateX(24px);
      background-color: #000;
    }
  </style>
</head>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAEYZBDOjkWZtvXOiwAcKT3RKbPcsQVDeg",
      authDomain: "quran-205d8.firebaseapp.com",
      projectId: "quran-205d8",
      storageBucket: "quran-205d8.firebasestorage.app",
      messagingSenderId: "622185595584",
      appId: "1:622185595584:web:cf5e3867d2974a5dc52325",
      measurementId: "G-MGQLFTTQYN"
    };

    // Initialize Firebase Compat
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Application state
    let currentSection = 'banners'; // banners, static_top_banners, custom_ads, app_config, prayer_config, donation_config, landing_config, broadcast, support, users
    let unsubscribeMainStream = null;
    let unsubscribeChatStream = null;
    let openTicketId = null;

    // Listen to Firebase Auth state
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        try {
          const adminDoc = await db.collection('admins').doc(user.uid).get();
          if (adminDoc.exists) {
            showView('dashboard');
            document.getElementById('display-email').innerText = user.email;
            setupGlobalListeners();
            switchSection(currentSection);
          } else {
            showAlert('login-alert', 'Access Denied: Your account is not authorized as an Administrator.', 'error');
            auth.signOut();
            showView('login');
          }
        } catch (err) {
          console.error(err);
          showAlert('login-alert', 'Authorization check failed: ' + err.message, 'error');
          auth.signOut();
          showView('login');
        }
      } else {
        showView('login');
      }
    });

    // Global counts listeners
    function setupGlobalListeners() {
      // Banners count
      db.collection('banners').onSnapshot(snap => {
        document.getElementById('stat-banners').innerText = snap.size;
      });
      // Ads count
      db.collection('custom_ads').onSnapshot(snap => {
        document.getElementById('stat-ads').innerText = snap.size;
      });
      // Users count
      db.collection('users').onSnapshot(snap => {
        document.getElementById('stat-users').innerText = snap.size;
      });
      // Pending Tickets count
      db.collection('support_tickets').onSnapshot(snap => {
        const pendingCount = snap.docs.filter(doc => doc.data().status !== 'closed' && doc.data().status !== 'resolved').length;
        document.getElementById('stat-tickets').innerText = pendingCount;
        
        const badge = document.getElementById('badge-support-count');
        if (pendingCount > 0) {
          badge.innerText = pendingCount;
          badge.style.display = 'block';
        } else {
          badge.style.display = 'none';
        }
      });
    }

    // Handle authentication
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');
      const spinner = document.getElementById('btn-spinner');
      const btnText = document.getElementById('btn-text');

      hideAlert('login-alert');
      submitBtn.disabled = true;
      spinner.style.display = 'block';
      btnText.innerText = 'Verifying Credentials...';

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        console.error(err);
        let errorMsg = 'Authentication failed. Please check your credentials.';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
          errorMsg = 'Incorrect Email or Password.';
        } else if (err.code === 'auth/invalid-email') {
          errorMsg = 'Invalid email address format.';
        } else {
          errorMsg = err.message;
        }
        showAlert('login-alert', errorMsg, 'error');
        submitBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.innerText = 'Authenticate Portal';
      }
    }

    // Handle logout
    function handleLogout() {
      if (unsubscribeMainStream) unsubscribeMainStream();
      if (unsubscribeChatStream) unsubscribeChatStream();
      auth.signOut();
    }

    // Switch between sidebar tabs
    function switchSection(sectionId) {
      document.getElementById('nav-' + currentSection).classList.remove('active');
      document.getElementById('nav-' + sectionId).classList.add('active');
      currentSection = sectionId;

      if (unsubscribeMainStream) {
        unsubscribeMainStream();
        unsubscribeMainStream = null;
      }

      renderPanelLayout(sectionId);
    }

    // Render Panel Layouts dynamically
    function renderPanelLayout(sectionId) {
      const container = document.getElementById('content-container');
      
      if (sectionId === 'banners' || sectionId === 'static_top_banners' || sectionId === 'custom_ads') {
        container.className = 'content-area';
        
        let targetLabel = 'Target Route / URL';
        let targetPlaceholder = 'e.g. /prayer-time or external URL';
        let titleText = 'Add Content Banner';
        let listTitle = 'Active Banners';

        if (sectionId === 'banners') {
          titleText = 'Add Visual Banner';
          listTitle = 'Active Visual Banners';
        } else if (sectionId === 'static_top_banners') {
          titleText = 'Add Header Banner';
          listTitle = 'Active Header Banners';
        } else if (sectionId === 'custom_ads') {
          titleText = 'Add Campaign Ad';
          listTitle = 'Active Campaign Ads';
          targetLabel = 'Target Campaign URL';
          targetPlaceholder = 'https://external-ad-link.com';
        }

        container.innerHTML = `
          <div class="panel-card">
            <h3>${titleText}</h3>
            <div id="panel-alert" class="alert"></div>
            <form onsubmit="handlePublishBanners(event)">
              <div class="form-group">
                <label>Title</label>
                <input type="text" id="form-title" required placeholder="e.g. Ramadan Mubarak 2026">
              </div>
              <div class="form-group">
                <label>Image URL</label>
                <input type="url" id="form-img" required placeholder="https://domain.com/image.png">
              </div>
              <div class="form-group">
                <label>${targetLabel}</label>
                <input type="text" id="form-target" required placeholder="${targetPlaceholder}">
              </div>
              <button type="submit" id="publish-btn" class="action-btn">Publish Entry</button>
            </form>
          </div>
          <div class="panel-card">
            <h3>${listTitle}</h3>
            <div class="items-container" id="panel-items-list">
              <div class="empty-state">Syncing Cloud Database...</div>
            </div>
          </div>
        `;

        setupBannersRealtimeStream(sectionId);

      } else if (sectionId === 'app_config') {
        container.className = 'content-area single-col';
        container.innerHTML = `
          <div class="panel-card" style="max-width: 950px; margin: 0 auto;">
            <h3>Update Configuration</h3>
            <div id="panel-alert" class="alert"></div>
            <form onsubmit="handleSaveAppConfig(event)">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                  <label>Version Name</label>
                  <input type="text" id="config-version" required placeholder="1.0.0">
                </div>
                <div class="form-group">
                  <label>Build Number</label>
                  <input type="number" id="config-build" required placeholder="1">
                </div>
              </div>
              
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; margin-bottom: 20px;">
                <div class="checkbox-group">
                  <input type="checkbox" id="config-force-update">
                  <label for="config-force-update">Enable Force Update</label>
                </div>
                <div class="checkbox-group">
                  <input type="checkbox" id="config-maintenance">
                  <label for="config-maintenance">Enable Maintenance Mode</label>
                </div>
                <div class="checkbox-group">
                  <input type="checkbox" id="config-namaz-active">
                  <label for="config-namaz-active">Namaz Guide Active</label>
                </div>
                <div class="checkbox-group">
                  <input type="checkbox" id="config-live-support">
                  <label for="config-live-support">Live Support Bot Active</label>
                </div>
              </div>

              <div style="border-top: 1px solid rgba(255,255,255,0.06); padding-top: 20px;">
                <div class="checkbox-group">
                  <input type="checkbox" id="config-show-announce" onchange="toggleAnnounceInputs(this.checked)">
                  <label for="config-show-announce">Show Global Announcement Popup</label>
                </div>
                
                <div id="announce-fields" style="display: none; padding-left: 20px; border-left: 2px solid var(--primary-gold); margin-bottom: 20px;">
                  <div class="form-group">
                    <label>Announcement Title</label>
                    <input type="text" id="config-ann-title" placeholder="Special announcement title">
                  </div>
                  <div class="form-group">
                    <label>Announcement Body</label>
                    <textarea id="config-ann-body" placeholder="Describe the announcement details..."></textarea>
                  </div>

    // Visual / Header / Ads Real-time Stream Loader
    function setupBannersRealtimeStream(collectionName) {
      const listContainer = document.getElementById('panel-items-list');
      
      unsubscribeMainStream = db.collection(collectionName)
        .orderBy('createdAt', 'desc')
        .onSnapshot((snapshot) => {
          listContainer.innerHTML = '';
          if (snapshot.empty) {
            listContainer.innerHTML = `
              <div class="empty-state">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0-2-.9-2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM17 12H7v-2h10v2zm-4 4H7v-2h6v2z"/></svg>
                <p>No active entries in this channel.</p>
              </div>`;
            return;
          }

          snapshot.forEach((doc) => {
            const data = doc.data();
            const id = doc.id;
            const title = data.title || 'Untitled';
            const imageUrl = data.imageUrl || '';
            const linkUrl = data.linkUrl || data.targetUrl || '';

            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
              <img src="${imageUrl}" class="item-img" alt="banner" onerror="this.src='../../logo.png';">
              <div class="item-info">
                <div class="item-title">${escapeHTML(title)}</div>
                <div class="item-subtitle">${escapeHTML(linkUrl)}</div>
              </div>
              <button onclick="handleDeleteBanner('${collectionName}', '${id}')" class="delete-btn" title="Delete">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              </button>
            `;
            listContainer.appendChild(row);
          });
        }, (error) => {
          console.error(error);
          listContainer.innerHTML = `<div class="empty-state" style="color: var(--error-color)">Sync error: ${error.message}</div>`;
        });
    }

    // Publish Visual Banners, Header Banners or Ads
    async function handlePublishBanners(e) {
      e.preventDefault();
      const title = document.getElementById('form-title').value.trim();
      const imageUrl = document.getElementById('form-img').value.trim();
      const targetVal = document.getElementById('form-target').value.trim();
      const publishBtn = document.getElementById('publish-btn');

      publishBtn.disabled = true;
      publishBtn.innerText = 'Publishing...';
      hideAlert('panel-alert');

      try {
        const payload = {
          title: title,
          imageUrl: imageUrl,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (currentSection === 'custom_ads') {
          payload.targetUrl = targetVal;
          payload.status = 'active';
          payload.type = 'banner';
        } else {
          payload.linkUrl = targetVal;
          payload.isActive = true;
        }

        await db.collection(currentSection).add(payload);
        showAlert('panel-alert', 'Published successfully!', 'success');
        e.target.reset();
      } catch (err) {
        console.error(err);
        showAlert('panel-alert', 'Failed to publish: ' + err.message, 'error');
      } finally {
        publishBtn.disabled = false;
        publishBtn.innerText = 'Publish Entry';
      }
    }

    // Push Notification Broadcast Stream
    function setupBroadcastsRealtimeStream() {
      const listContainer = document.getElementById('panel-items-list');
      
      unsubscribeMainStream = db.collection('broadcast_notifications')
        .orderBy('sentAt', 'desc')
        .onSnapshot((snapshot) => {
          listContainer.innerHTML = '';
          if (snapshot.empty) {
            listContainer.innerHTML = '<div class="empty-state">No broadcast logs found.</div>';
            return;
          }

          snapshot.forEach((doc) => {
            const data = doc.data();
            const id = doc.id;
            const title = data.title || 'No Title';
            const body = data.body || '';
            const sentAt = data.sentAt ? new Date(data.sentAt.seconds * 1000).toLocaleString() : 'Pending...';

            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
              <div class="item-info">
                <div class="item-title">${escapeHTML(title)}</div>
                <div class="item-subtitle">${escapeHTML(body)}</div>
                <div style="font-size: 0.7rem; color: var(--text-dark-gray); margin-top: 4px;">Sent: ${sentAt}</div>
              </div>
              <button onclick="handleDeleteBanner('broadcast_notifications', '${id}')" class="delete-btn" title="Delete Log">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              </button>
            `;
            listContainer.appendChild(row);
          });
        }, (error) => {
          listContainer.innerHTML = `<div class="empty-state" style="color: var(--error-color)">Sync error: ${error.message}</div>`;
        });
    }

    // Publish Broadcast notification
    async function handleSendBroadcast(e) {
      e.preventDefault();
      const title = document.getElementById('push-title').value.trim();
      const body = document.getElementById('push-body').value.trim();
      const img = document.getElementById('push-img').value.trim();
      const sendBtn = document.getElementById('push-send-btn');

      sendBtn.disabled = true;
      sendBtn.innerText = 'Broadcasting...';
      hideAlert('panel-alert');

      try {
        await db.collection('broadcast_notifications').add({
          title: title,
          body: body,
          imageUrl: img || "",
          type: 'broadcast',
          isRead: false,
          status: 'sent_to_queue',
          target: 'all',
          sentAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        showAlert('panel-alert', 'Notification Broadcasted successfully!', 'success');
        e.target.reset();
      } catch (err) {
        console.error(err);
        showAlert('panel-alert', 'Broadcast failed: ' + err.message, 'error');
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = 'Broadcast Now';
      }
    }

    // Users Database Stream Loader
    function setupUsersRealtimeStream() {
      const tbody = document.getElementById('users-table-body');
      
      unsubscribeMainStream = db.collection('users')
        .onSnapshot((snapshot) => {
          tbody.innerHTML = '';
          if (snapshot.empty) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No users registered yet.</td></tr>';
            return;
          }

          snapshot.forEach((doc) => {
            const data = doc.data();
            const id = doc.id;
            const name = data.displayName || data.name || 'Anonymous User';
            const email = data.email || 'No email';
            const role = data.role || 'user';
            const hasAccess = data.hasNamazGuideAccess !== false;

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td style="font-size: 0.8rem; font-family: monospace; color: var(--primary-gold);">${id}</td>
              <td style="font-weight: 600;">${escapeHTML(name)}</td>
              <td>${escapeHTML(email)}</td>
              <td><span style="background: rgba(255,255,255,0.06); padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; text-transform: uppercase;">${role}</span></td>
              <td>
                <label class="switch">
                  <input type="checkbox" ${hasAccess ? 'checked' : ''} onchange="handleToggleNamazAccess('${id}', this.checked)">
                  <span class="slider"></span>
                </label>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }, (error) => {
          tbody.innerHTML = `<tr><td colspan="5" class="empty-state" style="color: var(--error-color)">Sync error: ${error.message}</td></tr>`;
        });
    }

    // Toggle user Namaz Guide access
    async function handleToggleNamazAccess(userId, enabled) {
      try {
        await db.collection('users').doc(userId).update({
          hasNamazGuideAccess: enabled
        });
      } catch (err) {
        alert('Failed to update user access: ' + err.message);
      }
    }

    // Support Tickets Stream Loader
    function setupTicketsRealtimeStream() {
      const listContainer = document.getElementById('tickets-list');
      
      unsubscribeMainStream = db.collection('support_tickets')
        .orderBy('updatedAt', 'desc')
        .onSnapshot((snapshot) => {
          listContainer.innerHTML = '';
          if (snapshot.empty) {
            listContainer.innerHTML = '<div class="empty-state">No help support tickets found.</div>';
            return;
          }

          snapshot.forEach((doc) => {
            const data = doc.data();
            const id = doc.id;
            const user = data.userName || 'Anonymous User';
            const subject = data.subject || 'No Subject';
            const desc = data.description || '';
            const lastMsg = data.lastMessage || 'No conversation yet.';
            const status = data.status || 'open';
            const priority = data.priority || 'medium';
            const unread = data.unreadCount || 0;

            const card = document.createElement('div');
            card.className = 'ticket-row';
            card.innerHTML = `
              <div class="ticket-header">
                <span class="ticket-user">${escapeHTML(user)} ${unread > 0 ? `<span style="background: var(--error-color); color: #000; font-size: 0.7rem; font-weight: 800; padding: 2px 6px; border-radius: 50%; margin-left: 6px;">${unread}</span>` : ''}</span>
                <div class="badge-row">
                  <span class="status-badge ${status.toLowerCase()}">${status}</span>
                  <span class="priority-badge ${priority.toLowerCase()}">${priority}</span>
                </div>
              </div>
              <div class="ticket-body">
                <strong style="color: #fff; display: block; margin-bottom: 4px;">Subject: ${escapeHTML(subject)}</strong>
                <p style="font-size: 0.82rem; color: var(--text-dark-gray); margin-bottom: 8px;">${escapeHTML(desc)}</p>
                <p style="background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; border-left: 2px solid var(--primary-gold);">
                  <strong style="color: var(--primary-gold); font-size: 0.75rem; text-transform: uppercase; display: block;">Last Message:</strong>
                  ${escapeHTML(lastMsg)}
                </p>
              </div>
              <div class="ticket-footer">
                <div class="ticket-controls">
                  <div>
                    <label style="font-size: 0.7rem; color: var(--text-dark-gray); display: block; margin-bottom: 2px;">Status</label>
                    <select class="ticket-select" onchange="handleUpdateTicketStatus('${id}', this.value)">
                      <option value="open" ${status === 'open' ? 'selected' : ''}>Open</option>
                      <option value="inProgress" ${status === 'inProgress' ? 'selected' : ''}>In Progress</option>
                      <option value="resolved" ${status === 'resolved' ? 'selected' : ''}>Resolved</option>
                      <option value="closed" ${status === 'closed' ? 'selected' : ''}>Closed</option>
                    </select>
                  </div>
                  <div>
                    <label style="font-size: 0.7rem; color: var(--text-dark-gray); display: block; margin-bottom: 2px;">Priority</label>
                    <select class="ticket-select" onchange="handleUpdateTicketPriority('${id}', this.value)">
                      <option value="low" ${priority === 'low' ? 'selected' : ''}>Low</option>
                      <option value="medium" ${priority === 'medium' ? 'selected' : ''}>Medium</option>
                      <option value="high" ${priority === 'high' ? 'selected' : ''}>High</option>
                      <option value="urgent" ${priority === 'urgent' ? 'selected' : ''}>Urgent</option>
                    </select>
                  </div>
                </div>
                <button class="chat-trigger-btn" onclick="openChatModal('${id}', '${escapeHTML(user)}', '${escapeHTML(subject)}')">
                  <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: currentColor;"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                  Open Chat
                </button>
              </div>
            `;
            listContainer.appendChild(card);
          });
        }, (error) => {
          listContainer.innerHTML = `<div class="empty-state" style="color: var(--error-color)">Sync error: ${error.message}</div>`;
        });
    }

    // Update ticket status
    async function handleUpdateTicketStatus(ticketId, status) {
      try {
        await db.collection('support_tickets').doc(ticketId).update({
          status: status,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (err) {
        alert('Status update failed: ' + err.message);
      }
    }

    // Update ticket priority
    async function handleUpdateTicketPriority(ticketId, priority) {
      try {
        await db.collection('support_tickets').doc(ticketId).update({
          priority: priority,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (err) {
        alert('Priority update failed: ' + err.message);
      }
    }

    // Open Chat Modal and Listen to conversations
    function openChatModal(ticketId, userName, subject) {
      openTicketId = ticketId;
      document.getElementById('chat-modal-username').innerText = userName;
      document.getElementById('chat-modal-subject').innerText = subject;
      document.getElementById('chat-modal-overlay').style.display = 'flex';
      
      const messagesContainer = document.getElementById('chat-messages-wrap');
      messagesContainer.innerHTML = '<div class="empty-state">Loading Conversation...</div>';

      // Mark messages as read by admin
      db.collection('support_tickets').doc(ticketId).update({ unreadCount: 0 });
      db.collection('support_tickets').doc(ticketId).collection('messages')
        .where('senderType', '==', 'user')
        .where('isRead', '==', false)
        .get()
        .then(snap => {
          const batch = db.batch();
          snap.forEach(doc => batch.update(doc.reference, { isRead: true }));
          batch.commit();
        });

      // Stream messages
      unsubscribeChatStream = db.collection('support_tickets').doc(ticketId).collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot((snapshot) => {
          messagesContainer.innerHTML = '';
          if (snapshot.empty) {
            messagesContainer.innerHTML = '<div class="empty-state">No messages sent yet. Send a reply below.</div>';
            return;
          }

          snapshot.forEach((doc) => {
            const data = doc.data();
            const senderType = data.senderType || 'user';
            const message = data.message || '';
            const timestamp = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Sending...';

            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble ' + senderType;
            bubble.innerHTML = `
              ${escapeHTML(message)}
              <span class="chat-bubble-time">${timestamp}</span>
            `;
            messagesContainer.appendChild(bubble);
          });
          
          // Auto scroll to bottom
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, (error) => {
          messagesContainer.innerHTML = `<div class="empty-state" style="color: var(--error-color)">Chat load error: ${error.message}</div>`;
        });
    }

    // Close Chat Modal
    function closeChatModal() {
      document.getElementById('chat-modal-overlay').style.display = 'none';
      if (unsubscribeChatStream) {
        unsubscribeChatStream();
        unsubscribeChatStream = null;
      }
      openTicketId = null;
    }

    // Send Support Message as Admin
    async function handleSendSupportMessage(e) {
      e.preventDefault();
      const textInput = document.getElementById('chat-input-text');
      const messageText = textInput.value.trim();

      if (!messageText || !openTicketId) return;

      textInput.disabled = true;

      try {
        const ticketRef = db.collection('support_tickets').doc(openTicketId);
        
        // Add message
        await ticketRef.collection('messages').add({
          ticketId: openTicketId,
          senderId: auth.currentUser.uid,
          senderType: 'admin',
          message: messageText,
          isRead: false,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Update ticket details
        await ticketRef.update({
          lastMessage: messageText,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        textInput.value = '';
      } catch (err) {
        console.error(err);
        alert('Failed to send message: ' + err.message);
      } finally {
        textInput.disabled = false;
        textInput.focus();
      }
    }

    // UI View controller
    function showView(viewId) {
      const loginView = document.getElementById('login-view');
      const dbView = document.getElementById('dashboard-view');
      const submitBtn = document.getElementById('submit-btn');
      const spinner = document.getElementById('btn-spinner');
      const btnText = document.getElementById('btn-text');

      if (viewId === 'dashboard') {
        loginView.style.display = 'none';
        dbView.style.display = 'block';
      } else {
        loginView.style.display = 'block';
        dbView.style.display = 'none';
        // Reset login button state
        submitBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.innerText = 'Authenticate Portal';
      }
    }

    // Alert helper functions
    function showAlert(id, text, type) {
      const alertBox = document.getElementById(id);
      alertBox.innerText = text;
      alertBox.className = 'alert ' + type;
      alertBox.style.display = 'flex';
    }

    function hideAlert(id) {
      document.getElementById(id).style.display = 'none';
    }

    // Utilities
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
